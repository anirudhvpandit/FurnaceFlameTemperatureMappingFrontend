name: Production Validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      
      - run: npm run build

      - name: Check API
        run: |
          curl -f https://abhiftm.com/api/
